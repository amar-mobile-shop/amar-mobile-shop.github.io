<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mobile Shop</title>
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --ink: #1B2332; --muted: #6B7485; --line: #E2E6EE;
    --brand: #1F3864; --brand-2: #2E5AAC; --ok: #1E8E5A; --bad: #C0392B; --soft: #EEF3FC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
  header { background: var(--brand); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  header .title { font-weight: 700; font-size: 17px; }
  header .who { font-size: 13px; opacity: .85; }
  nav { display: flex; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 46px; z-index: 4; }
  nav button { flex: 1 0 auto; border: 0; background: none; padding: 12px 14px; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 12px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--soft); border-radius: 8px; padding: 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .stat.good .v { color: var(--ok); } .stat.bad .v { color: var(--bad); }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #CBD2DE; border-radius: 8px; font-size: 15px; background: #fff; color: var(--ink); font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
  .chk input { width: auto; }
  .btn { border: 0; border-radius: 8px; padding: 11px 18px; font-size: 15px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 600; }
  .btn.sec { background: #E7ECF5; color: var(--brand); }
  .btn.bad { background: #FBE9E7; color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 160px; }
  .row > .btn { flex: 0 0 auto; }
  .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .sub { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .sub button { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .sub button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #E7ECF5; color: var(--brand); }
  .pill.low { background: #FBE9E7; color: var(--bad); }
  .pill.sold { background: #EEE; color: #777; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; background: #fff; }
  .item.sel { border-color: var(--brand-2); background: var(--soft); }
  .total-box { background: var(--soft); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .total-box div { display: flex; justify-content: space-between; padding: 3px 0; }
  .total-box .big { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 12px 18px; border-radius: 8px; display: none; z-index: 50; max-width: 90%; }
  #toast.err { background: var(--bad); }
  #loading { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; align-items: center; justify-content: center; z-index: 40; font-weight: 600; color: var(--brand); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; z-index: 30; padding: 16px; overflow: auto; }
  .modal { background: #fff; border-radius: 10px; max-width: 440px; width: 100%; padding: 18px; margin: auto; }
  .modal.wide { max-width: 640px; background: #E9EDF4; }
  .modal .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .memo-wrap { overflow-x: auto; }
  .login { max-width: 360px; margin: 40px auto; }
  .users { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .users button { padding: 14px 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .users button.on { border-color: var(--brand); background: var(--soft); font-weight: 600; }
  .users small { display: block; color: var(--muted); font-size: 11px; }
  .hide { display: none !important; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    body { background: #fff; }
  }
</style>
<style id="memoCss">
  .memo { --m-brand: #1F3864; --m-accent: #2E5AAC; --m-line: #D5DBE6; --m-soft: #F2F5FA;
    background: #fff; color: #1B2332; font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; line-height: 1.45;
    width: 148mm; min-height: 200mm; margin: 0 auto; padding: 9mm 9mm 7mm; display: flex; flex-direction: column;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .memo.m-A4 { width: 210mm; min-height: 285mm; font-size: 13.5px; padding: 14mm 14mm 10mm; }
  .memo * { box-sizing: border-box; }
  .memo .m-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 10px; border-bottom: 3px solid var(--m-brand); }
  .memo .m-shop { font-size: 22px; font-weight: 800; color: var(--m-brand); letter-spacing: .3px; line-height: 1.15; }
  .memo .m-sub { color: #55607A; margin-top: 4px; font-size: 11.5px; }
  .memo .m-tag { background: var(--m-brand); color: #fff; font-weight: 700; letter-spacing: 2px; font-size: 12px; padding: 7px 12px; border-radius: 4px; white-space: nowrap; }
  .memo .m-meta { display: flex; justify-content: space-between; margin: 10px 0 8px; }
  .memo .m-meta span, .memo .m-cust span, .memo .m-words span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #7A849A; }
  .memo .m-meta b { font-size: 13px; }
  .memo .m-meta .r { text-align: right; }
  .memo .m-cust { display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px 14px; background: var(--m-soft); border-radius: 6px; padding: 9px 11px; margin-bottom: 12px; }
  .memo .m-cust .full { grid-column: 1 / -1; }
  .memo .m-cust b { font-weight: 600; }
  .memo table.m-items { width: 100%; border-collapse: collapse; }
  .memo .m-items th { background: var(--m-brand); color: #fff; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 7px 8px; text-align: left; }
  .memo .m-items th.n, .memo .m-items td.n { text-align: right; white-space: nowrap; }
  .memo .m-items th.c, .memo .m-items td.c { text-align: center; }
  .memo .m-items td { padding: 8px; border-bottom: 1px solid var(--m-line); vertical-align: top; }
  .memo .m-items td .d { color: #5E6981; font-size: 11px; margin-top: 2px; }
  .memo .m-items tr:nth-child(even) td { background: #FAFBFD; }
  .memo .m-sum { display: flex; justify-content: space-between; gap: 14px; margin-top: 12px; }
  .memo .m-words { flex: 1; font-size: 11.5px; }
  .memo .m-words .w { font-weight: 600; margin-bottom: 8px; }
  .memo .m-words .ex { border-left: 3px solid var(--m-accent); padding: 4px 8px; background: var(--m-soft); margin-top: 6px; }
  .memo table.m-tot { border-collapse: collapse; min-width: 52%; }
  .memo .m-tot td { padding: 4px 8px; }
  .memo .m-tot td.n { text-align: right; white-space: nowrap; }
  .memo .m-tot tr.grand td { background: var(--m-brand); color: #fff; font-weight: 700; font-size: 14px; padding: 8px; }
  .memo .m-warranty { margin-top: 10px; padding: 7px 10px; border: 1px dashed var(--m-accent); border-radius: 6px; font-size: 11.5px; }
  .memo .m-terms { margin-top: 10px; font-size: 10.5px; color: #4A5468; }
  .memo .m-terms b { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #7A849A; }
  .memo .m-terms ol { margin: 3px 0 0; padding-left: 16px; }
  .memo .m-sign { display: flex; justify-content: space-between; gap: 30px; margin-top: auto; padding-top: 34px; }
  .memo .m-sign div { flex: 1; border-top: 1px solid #888; padding-top: 4px; text-align: center; font-size: 11px; color: #4A5468; }
  .memo .m-foot { text-align: center; margin-top: 12px; font-size: 11px; color: var(--m-accent); font-weight: 600; }
  /* 80mm thermal roll */
  .memo.m-80mm { width: 76mm; min-height: 0; padding: 3mm 2mm; font-size: 11px; display: block; }
  .memo.m-80mm .m-head { flex-direction: column; align-items: center; text-align: center; border-bottom: 1px dashed #333; }
  .memo.m-80mm .m-shop { font-size: 16px; }
  .memo.m-80mm .m-tag { background: none; color: #000; padding: 2px 0 0; letter-spacing: 3px; }
  .memo.m-80mm .m-cust { grid-template-columns: 1fr; background: none; padding: 0; border-bottom: 1px dashed #333; border-radius: 0; padding-bottom: 6px; }
  .memo.m-80mm .m-items th { background: none; color: #000; border-bottom: 1px dashed #333; padding: 4px 2px; }
  .memo.m-80mm .m-items td { padding: 4px 2px; border-bottom: 1px dotted #bbb; }
  .memo.m-80mm .m-items tr:nth-child(even) td { background: none; }
  .memo.m-80mm .m-sum { flex-direction: column-reverse; gap: 6px; }
  .memo.m-80mm table.m-tot { width: 100%; }
  .memo.m-80mm .m-tot tr.grand td { background: none; color: #000; border-top: 1px dashed #333; border-bottom: 1px dashed #333; }
  .memo.m-80mm .m-words .ex { background: none; border-left: 0; padding: 0; }
  .memo.m-80mm .m-sign { padding-top: 26px; }
</style>
</head>
<body>
<header><div class="title" id="shopName">Mobile Shop</div><div class="who" id="who"></div></header>
<nav id="nav" class="hide"></nav>
<main id="app"></main>
<div id="toast"></div>
<div id="loading">Please wait...</div>
<div id="verWarn" class="hide" style="background:#C0392B;color:#fff;padding:12px 16px;font-weight:600"></div>
<div id="printArea"></div>
<style id="pageCss"></style>

<script>
/* ===== SETTING: paste your Apps Script Web App link (ends with /exec) between the quotes ===== */
var API_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
/* ============================================================================================ */
var APP_VERSION = '2.0';
function inApp() { try { return !!(window.AndroidApp && window.AndroidApp.isApp()); } catch (e) { return false; } }
var S = { token: null, boot: null, view: 'home', sub: {}, cart: [], selPhone: null };
try { S.token = localStorage.getItem('shopToken'); } catch (e) {}

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tk(n) { n = Number(n) || 0; return (n < 0 ? '-' : '') + 'Tk ' + Math.abs(Math.round(n)).toLocaleString('en-IN'); }
// Full access = every role except Sales Assistant
function isOwner() { return !!(S.boot && S.boot.full); }
function today() { return S.boot ? S.boot.today : new Date().toISOString().slice(0, 10); }
function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
function checked(id) { var el = $(id); return !!(el && el.checked); }
function opts(list, sel) { return list.map(function (x) { return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2500); }
function busy(on) { $('loading').style.display = on ? 'flex' : 'none'; }
function field(label, inner) { return '<div><label>' + label + '</label>' + inner + '</div>'; }
function inp(id, opt) { opt = opt || {}; return '<input id="' + id + '" type="' + (opt.type || 'text') + '"' + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + (opt.v != null ? ' value="' + esc(opt.v) + '"' : '') + (opt.mode ? ' inputmode="' + opt.mode + '"' : '') + '>'; }
function stat(k, v, cls) { return '<div class="stat ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
function yes(v) { return v === 'Yes'; }
function signCls(n) { return n < 0 ? 'bad' : 'good'; }
function prettyDate(k) {
  var m = String(k || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return k || '';
  return Number(m[3]) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(m[2]) - 1] + ' ' + m[1];
}

function call(action, payload, quiet) {
  if (!quiet) busy(true);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: S.token, action: action, p: payload || {} })
  }).then(function (r) { return r.json(); }, function (e) {
    busy(false); toast('No internet or server not reachable. Please try again.', true); throw e;
  }).then(function (res) {
    busy(false);
    if (res && res.ok) return res.data;
    if (res && res.auth === false) { logoutLocal(); toast(res.error, true); throw res.error; }
    var msg = (res && res.error) || 'Something went wrong';
    if (/Unknown action/.test(msg)) msg += '. Code.gs is out of date: paste the latest Code.gs and deploy a New version.';
    toast(msg, true); throw msg;
  }, function (e) { busy(false); if (typeof e === 'string') throw e; toast('Server error. Check the API_URL in index.html.', true); throw e; });
}

/* ---------- login ---------- */
function showLogin() {
  $('nav').classList.add('hide'); $('who').textContent = '';
  call('loginUsers', {}, true).then(function (users) {
    var sel = null;
    $('app').innerHTML = '<div class="card login"><h3>Login</h3><label>Select your name</label><div class="users" id="users">' +
      users.map(function (u) { return '<button data-id="' + esc(u.id) + '">' + esc(u.name) + '<small>' + esc(u.role) + '</small></button>'; }).join('') +
      '</div>' + field('PIN', inp('pin', { type: 'password', mode: 'numeric', ph: '****' })) +
      '<div class="actions"><button class="btn" id="loginBtn" style="width:100%">Login</button></div></div>';
    $('users').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      sel = b.getAttribute('data-id');
      Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
      $('pin').focus();
    };
    var go = function () {
      if (!sel) return toast('Select your name', true);
      call('login', { userId: sel, pin: val('pin') }).then(function (r) {
        S.token = r.token; try { localStorage.setItem('shopToken', r.token); } catch (e) {}
        start(r.defaultPin);
      });
    };
    $('loginBtn').onclick = go;
    $('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  });
}
function logoutLocal() { S.token = null; S.boot = null; S.view = 'home'; S.sub = {}; S.cart = []; try { localStorage.removeItem('shopToken'); } catch (e) {} showLogin(); }

function start(defaultPin) {
  call('bootstrap', { withDashboard: true }).then(function (b) {
    S.boot = b;
    S.prefetchDash = b.dashboard || null;
    if (b.version !== APP_VERSION) {
      $('verWarn').textContent = 'Version mismatch: Code.gs is version ' + (b.version || 'old') + ' but Index is version ' + APP_VERSION +
        '. Paste the latest Code.txt into Code.gs and Index.txt into Index, save, then Deploy > Manage deployments > Edit > New version.';
      $('verWarn').classList.remove('hide');
    } else $('verWarn').classList.add('hide');
    $('shopName').textContent = b.shop.name || 'Mobile Shop'; document.title = b.shop.name || 'Mobile Shop';
    $('who').textContent = b.user.Name + ' (' + b.user.Role + ')';
    buildNav();
    if (defaultPin) { S.view = 'more'; S.sub.more = 'pin'; toast('You are using the default PIN 1234. Please change it now.', true); }
    render();
  });
}

/* ---------- navigation ---------- */
var VIEWS = [
  { id: 'home', name: 'Dashboard' }, { id: 'sell', name: 'Sales' }, { id: 'stock', name: 'Phone Stock', owner: true },
  { id: 'acc', name: 'Accessories', owner: true }, { id: 'exp', name: 'Expenses', owner: true },
  { id: 'staff', name: 'Staff', owner: true }, { id: 'fin', name: 'Finance', owner: true }, { id: 'report', name: 'Reports', owner: true }, { id: 'more', name: 'Settings' }
];
function buildNav() {
  var n = $('nav'); n.classList.remove('hide');
  n.innerHTML = VIEWS.filter(function (v) { return !v.owner || isOwner(); })
    .map(function (v) { return '<button data-v="' + v.id + '">' + v.name + '</button>'; }).join('');
  n.onclick = function (e) { var b = e.target.closest('button'); if (b) { S.view = b.getAttribute('data-v'); render(); } };
}
function render() {
  Array.prototype.forEach.call($('nav').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === S.view); });
  window.scrollTo(0, 0);
  ({ home: viewHome, sell: viewSell, stock: viewStock, acc: viewAcc, exp: viewExp, staff: viewStaff, fin: viewFin, report: viewReport, more: viewMore }[S.view])();
}
function subTabs(view, tabs) {
  var cur = S.sub[view];
  if (!tabs.some(function (t) { return t[0] === cur; })) cur = tabs[0][0];
  S.sub[view] = cur;
  return '<div class="sub" id="sub">' + tabs.map(function (t) { return '<button data-s="' + t[0] + '" class="' + (t[0] === cur ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';
}
function bindSub(view) { $('sub').onclick = function (e) { var b = e.target.closest('button'); if (b) { S.sub[view] = b.getAttribute('data-s'); render(); } }; }

/* ---------- dashboard ---------- */
function viewHome() {
  $('app').innerHTML = '<div class="card">Loading...</div>';
  var got = S.prefetchDash ? Promise.resolve(S.prefetchDash) : call('dashboard', {}, true);
  S.prefetchDash = null;
  got.then(function (d) { try { renderHome(d); } catch (e) {
    $('app').innerHTML = '<div class="card">Could not show the dashboard: ' + esc(e.message) + '. If you just updated, make sure Code.gs and Index are the same version and deploy a New version.</div>'; }
  }, function () { $('app').innerHTML = '<div class="card">Could not load the dashboard. Pull down to refresh or log in again.</div>'; });
}
function renderHome(d) {
  {
    var low = d.lowStock.length ? '<div class="card"><h3>Low Stock Accessories</h3><table class="tbl">' +
      d.lowStock.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td class="n"><span class="pill low">' + x.stock + ' pcs</span></td></tr>'; }).join('') + '</table></div>' : '';
    if (d.role !== 'Owner') {
      var mine = function (x) { return stat('Phones Sold', x.phoneCount) + stat('Accessories Sold', x.accQty + ' pcs') + stat('Total Sales', tk(x.totalSales)); };
      $('app').innerHTML = '<div class="card"><h3>Your Sales Today</h3><div class="grid">' + mine(d.today) + '</div></div>' +
        '<div class="card"><h3>Your Sales This Month</h3><div class="grid">' + mine(d.month) + '</div></div>' +
        '<div class="card"><h3>Stock</h3><div class="grid">' + stat('Phones in Stock', d.stockPhones) + '</div></div>' + low;
      return;
    }
    var t = d.today, m = d.month;
    $('app').innerHTML =
      '<div class="card"><h3>Today</h3><div class="grid">' +
      stat('Phones Sold', t.phoneCount) + stat('Total Sales', tk(t.totalSales)) + stat('Gross Profit', tk(t.grossProfit)) +
      stat('Expenses + Salary', tk(t.expenses + t.staffPaid)) + stat('Net Profit', tk(t.netProfit), signCls(t.netProfit)) + stat('Net Cash', tk(t.netCash), signCls(t.netCash)) +
      '</div></div>' +
      '<div class="card"><h3>This Month</h3><div class="grid">' +
      stat('Phones Sold', m.phoneCount) + stat('Total Sales', tk(m.totalSales)) + stat('Gross Profit', tk(m.grossProfit)) +
      stat('Expenses + Salary', tk(m.expenses + m.staffPaid)) + stat('Net Profit', tk(m.netProfit), signCls(m.netProfit)) +
      '</div></div>' +
      '<div class="card"><h3>Stock</h3><div class="grid">' +

      '</div></div>' +

/* ---------- sales ---------- */
function viewSell() {
  var tabs = [['phone', 'Sell Phone'], ['acc', 'Sell Accessories'], ['list', 'Sales History']];
  if (isOwner()) tabs.push(['ret', 'Returns']);
  var html = subTabs('sell', tabs);
  var s = S.sub.sell;
  if (s === 'phone') html += sellPhoneForm();
  if (s === 'acc') html += '<div id="accSell"></div>';
  if (s === 'ret') html += '<div id="retBox"></div>';
  if (s === 'list') html += '<div class="card"><div class="row">' + field('From', inp('sFrom', { type: 'date', v: S.salesFrom || today() })) +
    field('To', inp('sTo', { type: 'date', v: S.salesTo || today() })) +
    (isOwner() ? field('Staff', '<select id="sWho"><option value="">All staff</option>' + opts(S.boot.staffNames, S.salesWho) + '</select>') : '') +
    '<button class="btn" id="sLoad">Show</button></div></div><div id="sList"></div>';
  $('app').innerHTML = html; bindSub('sell');
  if (s === 'phone') bindSellPhone();

    field('Customer Name', inp('spCust')) + field('Customer Mobile', inp('spMob', { mode: 'tel' })) +
    field('Customer Address (optional)', inp('spAddr')) +

    field('Warranty', inp('spWar', { ph: 'e.g. 1 year official warranty' })) +

function bindSellPhone() {
  S.selPhone = null;
  S.phoneAcc = [];
  var accMap = {};
  call('accList', {}, true).then(function (items) {
    items.forEach(function (i) { accMap[i.code] = i; });
    $('paItem').innerHTML = '<option value="">-- Select --</option>' + items.map(function (i) {
      return '<option value="' + esc(i.code) + '"' + (i.stock <= 0 ? ' disabled' : '') + '>' + esc(i.name) + ' (stock ' + i.stock + ', ' + tk(i.price) + ')</option>'; }).join('');
  });
  $('paItem').onchange = function () { var it = accMap[this.value]; $('paPrice').value = it ? it.price : ''; };
  var drawPa = function () {
    $('paList').innerHTML = S.phoneAcc.length ? '<table class="tbl" id="paTbl">' + S.phoneAcc.map(function (c, i) {
      return '<tr><td>' + esc(c.name) + '</td><td class="n">' + c.qty + ' x ' + tk(c.unitPrice) + '</td><td class="n">' + tk(c.qty * c.unitPrice) +
        '</td><td><button class="btn bad sm" data-rm="' + i + '">x</button></td></tr>'; }).join('') + '</table>' : '';
    if ($('paTbl')) $('paTbl').onclick = function (e) { var b = e.target.closest('[data-rm]'); if (b) { S.phoneAcc.splice(Number(b.getAttribute('data-rm')), 1); drawPa(); upd(); } };
  };
  $('paAdd').onclick = function () {
    var code = val('paItem'); if (!code) return toast('Select an accessory', true);
    var qty = Number(val('paQty')) || 0; if (qty <= 0) return toast('Enter quantity', true);
    var it = accMap[code];
    S.phoneAcc.push({ code: code, name: it.name, qty: qty, unitPrice: Number(val('paPrice')) || it.price, discount: 0, cost: it.cost });
    $('paItem').value = ''; $('paQty').value = 1; $('paPrice').value = '';
    drawPa(); upd();
  };
  var find = function () {
    call('phoneFind', { q: val('fImei') }).then(function (list) {
      if (!list.length) { $('fRes').innerHTML = '<div class="muted">No phone in stock with this IMEI.</div>'; return; }
      $('fRes').innerHTML = list.map(function (p, i) {
        return '<div class="item" data-i="' + i + '"><div><b>' + esc(p.brand + ' ' + p.model) + '</b> ' + esc(p.variant || '') + ' ' + esc(p.color || '') +
          '<div class="muted">IMEI: ' + esc(p.imei1) + ' · ' + esc(p.type) + '</div></div><div class="n"><b>' + tk(p.asking) + '</b>' +
          (p.cost != null ? '<div class="muted">Cost ' + tk(p.cost) + '</div>' : '') + '</div></div>';
      }).join('');
      $('fRes').onclick = function (e) {
        var it = e.target.closest('.item'); if (!it) return;
        S.selPhone = list[Number(it.getAttribute('data-i'))];
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('sel', x === it); });
        if (!val('spPrice')) $('spPrice').value = S.selPhone.asking || '';
        upd();
      };
      if (list.length === 1) $('fRes').firstChild.click();
    });
  };
  $('fBtn').onclick = find;
  $('fImei').onkeydown = function (e) { if (e.key === 'Enter') find(); };
  $('spEx').onchange = function () { $('exBox').classList.toggle('hide', !this.checked); upd(); };
  ['spPrice', 'spDisc', 'exCost'].forEach(function (id) { $(id).oninput = upd; });
  function upd() {
    var price = Number(val('spPrice')) || 0, disc = Number(val('spDisc')) || 0, ex = checked('spEx') ? (Number(val('exCost')) || 0) : 0;
    var acc = (S.phoneAcc || []).reduce(function (a, c) { return a + c.qty * c.unitPrice; }, 0);
    var accProfit = (S.phoneAcc || []).reduce(function (a, c) { return a + c.qty * (c.unitPrice - (c.cost || 0)); }, 0);
    $('spTotal').innerHTML = (S.selPhone ? '<div><span>Phone</span><b>' + esc(S.selPhone.brand + ' ' + S.selPhone.model) + '</b></div>' : '<div class="muted">Select a phone above first</div>') +
      '<div><span>Phone Price</span><span>' + tk(price) + '</span></div>' + (acc ? '<div><span>Accessories</span><span>' + tk(acc) + '</span></div>' : '') +
      '<div><span>Discount</span><span>- ' + tk(disc) + '</span></div>' +
      (ex ? '<div><span>Exchange Phone</span><span>- ' + tk(ex) + '</span></div>' : '') +
      '<div class="big"><span>Total Payable</span><span>' + tk(price + acc - disc - ex) + '</span></div>' +
      (S.selPhone && S.selPhone.cost != null ? '<div class="muted"><span>Profit</span><span>' + tk(price - disc - S.selPhone.cost + accProfit) + '</span></div>' : '');
  }
  upd();
  $('spSave').onclick = function () {
    if (!S.selPhone) return toast('Select a phone first', true);
    var p = { phoneId: S.selPhone.id, date: val('spDate'), salePrice: val('spPrice'), discount: val('spDisc'), customerName: val('spCust'),
              customerMobile: val('spMob'), customerAddress: val('spAddr'), paymentMethod: val('spPay'), warranty: val('spWar') };
    if (checked('spEx')) { p.exchange = readPhone('ex'); p.exchange.seller = readSeller('ex'); }
    if (S.phoneAcc.length) p.accLines = S.phoneAcc.map(function (c) { return { code: c.code, qty: c.qty, unitPrice: c.unitPrice, discount: 0 }; });
    call('phoneSell', p).then(function (memo) { toast('Sale completed'); S.sub.sell = 'phone'; render(); showMemo(memo); });
  };
}

function renderAccSell() {
  var L = S.boot.lists;
  call('accList', {}, true).then(function (items) {
    var map = {}; items.forEach(function (i) { map[i.code] = i; });
    var F = S.accForm || (S.accForm = { date: today(), cust: '', mob: '', pay: '', inv: '' });
    if (S.addToInvoice) { F.inv = S.addToInvoice; S.addToInvoice = null; }
    var keep = function () { if ($('asDate')) { F.date = val('asDate'); F.cust = val('asCust'); F.mob = val('asMob'); F.pay = val('asPay'); F.inv = val('asInv'); } };
    function draw() {
      var total = 0;
      var rows = S.cart.map(function (c, i) {
        var line = c.qty * c.unitPrice - c.discount; total += line;
        return '<tr><td>' + esc(map[c.code] ? map[c.code].name : c.code) + '</td><td class="n">' + c.qty + ' x ' + tk(c.unitPrice) + (c.discount ? '<div class="muted">-' + tk(c.discount) + '</div>' : '') +
          '</td><td class="n">' + tk(line) + '</td><td><button class="btn bad sm" data-rm="' + i + '">x</button></td></tr>';
      }).join('');
      $('accSell').innerHTML = '<div class="card"><h3>Add Item</h3><div class="form">' +
        field('Item', '<select id="asItem"><option value="">-- Select --</option>' + items.map(function (i) {
          return '<option value="' + esc(i.code) + '"' + (i.stock <= 0 ? ' disabled' : '') + '>' + esc(i.name) + ' (stock ' + i.stock + ', ' + tk(i.price) + ')</option>'; }).join('') + '</select>') +
        field('Quantity', inp('asQty', { type: 'number', v: 1 })) + field('Unit Price (Tk)', inp('asPrice', { type: 'number' })) + field('Discount (Tk)', inp('asDisc', { type: 'number', v: 0 })) +
        '</div><div class="actions"><button class="btn sec" id="asAdd">+ Add to Bill</button></div></div>' +
        '<div class="card"><h3>Bill</h3>' + (S.cart.length ? '<table class="tbl" id="asCart">' + rows + '</table>' : '<div class="muted">No items added yet</div>') +
        '<div class="total-box"><div class="big"><span>Total Payable</span><span>' + tk(total) + '</span></div></div><div class="form" style="margin-top:12px">' +
        field('Add to Existing Memo No. (optional)', inp('asInv', { v: F.inv, ph: 'e.g. INV-00012 or 12' })) +
        '<div id="asNewCust"' + (F.inv ? ' class="hide"' : '') + ' style="display:contents">' +
        field('Date', inp('asDate', { type: 'date', v: F.date })) + field('Customer Name (optional)', inp('asCust', { v: F.cust })) +
        field('Customer Mobile (optional)', inp('asMob', { mode: 'tel', v: F.mob })) + '</div>' +
        field('Payment Method', '<select id="asPay">' + opts(L.paymentMethods, F.pay) + '</select>') +
        '</div><div class="muted" id="asInvNote" style="margin-top:8px">' + (F.inv ? 'These items will be added to memo ' + esc(F.inv) + ' with the same customer and date.' : 'Leave the memo number blank for a new memo.') + '</div>' +
        '<div class="actions"><button class="btn" id="asSave"' + (S.cart.length ? '' : ' disabled') + '>' + (F.inv ? 'Add to Memo &amp; Print' : 'Complete Sale &amp; Print Memo') + '</button></div></div>';
      $('asInv').oninput = function () {
        var on = !!val('asInv');
        $('asNewCust').classList.toggle('hide', on);
        $('asInvNote').textContent = on ? 'These items will be added to memo ' + val('asInv') + ' with the same customer and date.' : 'Leave the memo number blank for a new memo.';
        $('asSave').innerHTML = on ? 'Add to Memo &amp; Print' : 'Complete Sale &amp; Print Memo';
      };
      $('asItem').onchange = function () { var it = map[this.value]; $('asPrice').value = it ? it.price : ''; };
      $('asAdd').onclick = function () {
        var code = val('asItem'); if (!code) return toast('Select an item', true);
        var qty = Number(val('asQty')) || 0; if (qty <= 0) return toast('Enter quantity', true);
        S.cart.push({ code: code, qty: qty, unitPrice: Number(val('asPrice')) || map[code].price, discount: Number(val('asDisc')) || 0 });
        keep(); draw();
      };
      if ($('asCart')) $('asCart').onclick = function (e) { var b = e.target.closest('[data-rm]'); if (b) { S.cart.splice(Number(b.getAttribute('data-rm')), 1); keep(); draw(); } };
      $('asSave').onclick = function () {
        call('accSell', { lines: S.cart, invoice: val('asInv'), date: val('asDate'), customerName: val('asCust'), customerMobile: val('asMob'), paymentMethod: val('asPay') })
          .then(function (memo) { S.cart = []; S.accForm = null; toast(val('asInv') ? 'Added to memo ' + memo.invoice : 'Sale completed'); renderAccSell(); showMemo(memo); });
      };
    }
    draw();
  });
}

function loadSales() {
  S.salesFrom = val('sFrom'); S.salesTo = val('sTo'); S.salesWho = val('sWho');
  call('salesList', { from: S.salesFrom, to: S.salesTo, soldBy: S.salesWho }).then(function (d) {
    var own = isOwner();
    var all = d.phones.concat(d.acc);
    var tot = all.reduce(function (a, x) { return a + x.amount; }, 0), prof = all.reduce(function (a, x) { return a + (x.profit || 0); }, 0);
    var row = function (x) {
      return '<tr><td>' + esc(prettyDate(x.date)) + '<div class="muted">' + esc(x.invoice) + '</div></td><td>' + esc(x.item) + (x.imei ? '<div class="muted">' + esc(x.imei) + '</div>' : '') +
        (x.exchange ? '<div class="muted">Exchange ' + tk(x.exchange) + '</div>' : '') +
        (x.returned ? ' <span class="pill low">Returned' + (x.kind === 'acc' ? ' ' + x.returned : '') + '</span>' : '') + '</td><td>' + esc(x.customer) + '<div class="muted">' + esc(x.mobile) + '</div></td>' +
        '<td>' + esc(x.soldBy) + '<div class="muted">' + esc(x.payment) + '</div></td><td class="n">' + tk(x.amount) + '</td>' +
        (own ? '<td class="n">' + tk(x.profit) + '</td>' : '') +
        '<td style="white-space:nowrap"><button class="btn sec sm" data-memo="' + esc(x.invoice) + '">Memo</button>' +
        (own ? ' <button class="btn sec sm" data-ret="' + esc(x.invoice) + '">Return</button> <button class="btn bad sm" data-del="' + esc(x.kind + '|' + x.id) + '">Delete</button>' : '') + '</td></tr>';
    };
    $('sList').innerHTML = '<div class="card"><div class="grid">' + stat('Total Sales', tk(tot)) + stat('Phones Sold', d.phones.length) +
      (own ? stat('Profit', tk(prof), signCls(prof)) : '') + '</div></div><div class="card scroll"><table class="tbl" id="sTbl"><tr><th>Date</th><th>Item</th><th>Customer</th><th>Sold By</th><th class="n">Amount</th>' +
      (own ? '<th class="n">Profit</th>' : '') + '<th></th></tr>' + (all.length ? all.map(row).join('') : '<tr><td colspan="7" class="muted">No sales found</td></tr>') + '</table></div>';
    $('sTbl').onclick = function (e) {
      var m = e.target.closest('[data-memo]');
      if (m) { call('memoGet', { invoice: m.getAttribute('data-memo') }).then(showMemo); return; }
      var rt = e.target.closest('[data-ret]');
      if (rt) { S.retInvoice = rt.getAttribute('data-ret'); S.sub.sell = 'ret'; render(); return; }
      var b = e.target.closest('[data-del]'); if (!b) return;
      var parts = b.getAttribute('data-del').split('|');
      if (!confirm('Delete this sale? Use this only for a wrong entry. For a customer return, use Return instead.')) return;
      call(parts[0] === 'phone' ? 'phoneSaleDelete' : 'accSaleDelete', { id: parts[1] }).then(function () { toast('Deleted'); loadSales(); });
    };
  });
}

function drawReturnForm(d) {

  var html = '<div class="card"><h3>Memo ' + esc(d.invoice) + '</h3><div class="muted">' + esc(prettyDate(d.date)) + ' · ' + esc(d.customer || 'No name') + ' ' + esc(d.mobile || '') + ' · Sold by ' + esc(d.soldBy) + '</div>';

  html += '<div style="margin-top:12px">' + d.items.map(function (it, i) {
    var dis = it.returnable <= 0;
    var head = '<label class="chk" style="font-weight:600"><input type="checkbox" data-i="' + i + '" class="rtPick"' + (dis ? ' disabled' : '') + '> ' + esc(it.name) +

    if (!dis) {
      body = '<div class="form" style="margin:8px 0 0 26px">' +

        field('Condition', '<select id="rtC' + i + '"><option value="1">Good: back to stock</option><option value="0">Faulty: keep out of stock</option></select>') + '</div>' +
        (it.exchange ? '<div class="chk" style="margin:8px 0 0 26px"><input type="checkbox" id="rtE' + i + '"' + (it.exchange.available ? '' : ' disabled') + '> Give back the exchanged phone (' +
          esc(it.exchange.name) + ', ' + tk(it.exchange.value) + ')' + (it.exchange.available ? '' : ' <span class="muted">(already sold)</span>') + '</div>' : '');
    }
    return '<div class="item" style="display:block;cursor:default">' + head + '<div class="muted" style="margin-left:26px">' +
      (it.kind === 'Phone' ? 'Sold for ' + tk(it.value) : it.qty + ' x ' + tk(it.unitValue)) + '</div>' + body + '</div>';
  }).join('') + '</div>';
  if (avail.length) html += '<div class="form" style="margin-top:12px">' + field('Return Date', inp('rtDate', { type: 'date', v: today() })) +
    field('Refund to Customer (Tk)', inp('rtRefund', { type: 'number' })) + field('Refund Method', '<select id="rtPay">' + opts(L.paymentMethods) + '</select>') +
    field('Reason', inp('rtReason', { ph: 'e.g. Display problem, changed mind' })) + '</div><div class="total-box" id="rtTotal"></div>' +
    '<div class="actions"><button class="btn" id="rtSave">Complete Return &amp; Print Receipt</button></div>';

  $('rtForm').innerHTML = html + '</div>';
  if ($('rtPrev')) $('rtPrev').onclick = returnTableClick(function () { $('rtFind').click(); loadReturnList(); });
  if (!avail.length) return;
  var edited = false;
  var picks = function () {
    var out = [];
    d.items.forEach(function (it, i) {
      var cb = document.querySelector('.rtPick[data-i="' + i + '"]');
      if (!cb || !cb.checked) return;
      var q = it.kind === 'Phone' ? 1 : Math.min(Number(val('rtQ' + i)) || 0, it.returnable);
      out.push({ it: it, saleId: it.saleId, qty: q, restock: val('rtC' + i) === '1', giveBackExchange: !!(it.exchange && checked('rtE' + i)) });
    });

  var calc = function () {

      value += x.it.kind === 'Phone' ? x.it.value : x.it.unitValue * x.qty;

  };
}

/* ---------- cash memo ---------- */
function amountInWords(n) {
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'Zero Taka Only';
  var ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
              'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  var tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function two(x) { return x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : ''); }
  function three(x) { var h = Math.floor(x / 100), r = x % 100; return (h ? ones[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : ''); }
  var parts = [], crore = Math.floor(n / 10000000), lakh = Math.floor(n / 100000) % 100, thousand = Math.floor(n / 1000) % 100, rest = n % 1000;
  if (crore) parts.push(three(crore) + ' Crore');
  if (lakh) parts.push(two(lakh) + ' Lakh');
  if (thousand) parts.push(two(thousand) + ' Thousand');
  if (rest) parts.push(three(rest));
  return parts.join(' ') + ' Taka Only';
}

function memoMarkup(r) {
  var size = r.memoSize || 'A5';
  var rows = r.lines.map(function (l, i) {
    return '<tr><td class="c">' + (i + 1) + '</td><td><b>' + esc(l.name) + '</b>' +
      (l.details && l.details.length ? '<div class="d">' + l.details.map(esc).join('<br>') + '</div>' : '') +
      '</td><td class="c">' + l.qty + '</td><td class="n">' + tk(l.price) + '</td><td class="n">' + tk(l.total) + '</td></tr>';
  }).join('');
  var isRet = r.kind === 'return';
  var ex = (r.exchanges || []).map(function (x) {
    return '<div class="ex">' + (isRet ? '' : 'Exchange received: ') + '<b>' + esc(x.name) + '</b>' + (x.imei ? '<br>IMEI: ' + esc(x.imei) : '') + '<br>Value: ' + tk(x.value) + '</div>';
  }).join('');
  return '<div class="memo m-' + esc(size) + '">' +
    '<div class="m-head"><div><div class="m-shop">' + esc(r.shop.name) + '</div><div class="m-sub">' + esc(r.shop.address || '') +
      (r.shop.phone ? (r.shop.address ? '<br>' : '') + 'Phone: ' + esc(r.shop.phone) : '') + '</div></div><div class="m-tag">' + esc(r.title || 'CASH MEMO') + '</div></div>' +
    '<div class="m-meta"><div><span>' + esc(r.numberLabel || 'Memo No') + '</span><b>' + esc(r.invoice) + '</b></div><div class="r"><span>Date</span><b>' + esc(prettyDate(r.date)) + '</b></div></div>' +
    '<div class="m-cust"><div><span>Customer Name</span><b>' + (esc(r.customer) || '&nbsp;') + '</b></div><div><span>Mobile</span><b>' + (esc(r.mobile) || '&nbsp;') + '</b></div>' +
      (r.address ? '<div class="full"><span>Address</span>' + esc(r.address) + '</div>' : '') + '</div>' +
    '<table class="m-items"><thead><tr><th class="c">SL</th><th>Description</th><th class="c">Qty</th><th class="n">Unit Price</th><th class="n">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="m-sum"><div class="m-words"><span>Amount in Words</span><div class="w">' + esc(amountInWords(r.payable)) + '</div>' +
      '<span>Payment Method</span><div class="w">' + esc(r.payment || 'Cash') + '</div>' + ex + '</div>' +
      '<table class="m-tot"><tr><td>Subtotal</td><td class="n">' + tk(r.subtotal) + '</td></tr>' +
      (r.discount ? '<tr><td>' + esc(r.discountLabel || 'Discount') + '</td><td class="n">- ' + tk(r.discount) + '</td></tr>' : '') +
      (r.exchange ? '<tr><td>' + esc(r.exchangeLabel || 'Exchange Value') + '</td><td class="n">- ' + tk(r.exchange) + '</td></tr>' : '') +
      '<tr class="grand"><td>' + esc(r.totalLabel || 'Total Payable') + '</td><td class="n">' + tk(r.payable) + '</td></tr>' +
      (r.refunded ? '<tr><td>Refunded for returns</td><td class="n">- ' + tk(r.refunded) + '</td></tr>' : '') + '</table></div>' +
    (r.warranty ? '<div class="m-warranty"><b>Warranty:</b> ' + esc(r.warranty) + '</div>' : '') +
    (r.terms && r.terms.length ? '<div class="m-terms"><b>' + (isRet ? 'Notes' : 'Terms &amp; Conditions') + '</b><ol>' + r.terms.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></div>' : '') +
    '<div class="m-sign"><div>Customer Signature</div><div>Authorized Signature<br>' + (isRet ? 'Handled by: ' : 'Sold by: ') + esc(r.soldBy) + '</div></div>' +
    '<div class="m-foot">Thank you for shopping with us!</div></div>';
}

function pageRule(size) {
  if (size === '80mm') return '@page { size: 80mm auto; margin: 2mm; }';
  if (size === 'A4') return '@page { size: A4 portrait; margin: 0; }';
  return '@page { size: A5 portrait; margin: 0; }';
}

function memoDocument(r, withButton) {
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(r.invoice) + '</title><style>' +
    $('memoCss').textContent + pageRule(r.memoSize) + ' body{margin:0;background:' + (withButton ? '#E9EDF4' : '#fff') + '} .tb{text-align:center;padding:12px} .tb button{font-size:15px;padding:10px 22px;border:0;border-radius:8px;background:#1F3864;color:#fff;cursor:pointer}' +
    ' @media print{.tb{display:none} body{background:#fff}}</style></head><body>' +
    (withButton ? '<div class="tb"><button onclick="window.print()">Print / Save as PDF</button></div>' : '') + memoMarkup(r) + '</body></html>';
}

function printMemo(r) {
  if (inApp()) { window.AndroidApp.printHtml(memoDocument(r, false), 'Cash Memo ' + r.invoice); return; }
  $('printArea').innerHTML = memoMarkup(r);
  $('pageCss').textContent = pageRule(r.memoSize);
  setTimeout(function () { window.print(); }, 50);
}

function openMemoTab(r) {
  var w = window.open('', '_blank');
  if (!w) return toast('Your browser blocked the new tab. Use the Print button instead.', true);
  w.document.write(memoDocument(r, true));

}

function showMemo(r) {
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal wide"><div class="bar"><button class="btn" id="mPrint">' + (inApp() ? 'Print / Save PDF' : 'Print Memo') + '</button>' +
    (inApp() ? '' : '<button class="btn sec" id="mTab">Open in New Tab / PDF</button>') +
    (r.invoice && r.invoice !== 'INV-00000' && r.kind !== 'return' ? '<button class="btn sec" id="mAddAcc">+ Add Accessories to this Memo</button>' : '') +
    '<button class="btn sec" id="mClose">Close</button></div><div class="memo-wrap">' + memoMarkup(r) + '</div></div>';
  document.body.appendChild(bg);
  $('mPrint').onclick = function () { printMemo(r); };
  if ($('mTab')) $('mTab').onclick = function () { openMemoTab(r); };
  $('mClose').onclick = function () { bg.remove(); };

function loadBackup() {
  var draw = function (b) {
    var link = function (url, text) { return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + '</a>'; };
    $('bkBox').innerHTML = '<div class="card"><h3>Automatic Monthly Backup</h3><div class="grid">' +
      stat('Status', b.enabled ? 'On' : 'Off', b.enabled ? 'good' : 'bad') +
      stat('Last Backup', b.last ? esc(prettyDate(b.last.date.slice(0, 10))) + ' ' + esc(b.last.date.slice(11)) : 'Never') +
      stat('Backups Kept', b.backups.length + ' of ' + b.keep) + '</div>' +
      '<div class="muted" style="margin-top:10px">When on, a full copy of your shop sheet is saved on the 1st of every month at about 2 AM in the Google Drive folder "' + esc(b.folderName) +
      '". The newest ' + b.keep + ' backups are kept and older ones go to the Drive trash.</div>' +
      '<div class="actions">' + (b.enabled ? '<button class="btn bad" id="bkOff">Turn Off</button>' : '<button class="btn" id="bkOn">Turn On Monthly Backup</button>') +
      '<button class="btn sec" id="bkNow">Backup Now</button>' + (b.folderUrl ? '<a class="btn sec" style="text-decoration:none" href="' + esc(b.folderUrl) + '" target="_blank" rel="noopener">Open Backup Folder</a>' : '') + '</div></div>' +
      '<div class="card scroll"><h3>Backups</h3><table class="tbl"><tr><th>Date</th><th>File</th></tr>' +
      (b.backups.length ? b.backups.map(function (x) { return '<tr><td style="white-space:nowrap">' + esc(prettyDate(x.date.slice(0, 10))) + '<div class="muted">' + esc(x.date.slice(11)) + '</div></td><td>' + link(x.url, x.name) + '</td></tr>'; }).join('')
        : '<tr><td colspan="2" class="muted">No backups yet. Tap Backup Now to make the first one.</td></tr>') + '</table>' +
      '<div class="muted" style="margin-top:8px">To restore: open a backup file and copy the tabs you need back into the main sheet, or ask your developer for help.</div></div>';
    if ($('bkOn')) $('bkOn').onclick = function () { call('backupEnable').then(function (x) { toast('Monthly backup turned on'); draw(x); }, backupHelp); };
    if ($('bkOff')) $('bkOff').onclick = function () { if (confirm('Turn off the monthly backup?')) call('backupDisable').then(function (x) { toast('Monthly backup turned off'); draw(x); }, backupHelp); };
    $('bkNow').onclick = function () { call('backupNow').then(function (x) { toast('Backup saved to Google Drive'); draw(x); }, backupHelp); };
  };
  call('backupStatus', {}, true).then(draw, backupHelp);
}
function backupHelp(err) {
  if (!$('bkBox')) return;
  $('bkBox').innerHTML = '<div class="card"><h3>Backup needs permission</h3><div class="muted">' + esc(err || '') + '</div>' +
    '<p>Google needs your one-time permission to save backups to your Drive:</p><ol><li>Open the sheet &gt; Extensions &gt; Apps Script.</li>' +
    '<li>In the function list next to Run, choose <b>setupBackup</b> and click Run.</li><li>Click Review permissions &gt; your account &gt; Advanced &gt; Go to project &gt; Allow.</li>' +
    '<li>Come back here and refresh.</li></ol></div>';
}

      '<th class="n">Phones Sold</th><th class="n">Phone Sales</th><th class="n">Acc. Qty</th><th class="n">Acc. Sales</th><th class="n">Total Sales</th><th class="n">Profit</th>' +
      '<th class="n">Returns</th><th class="n">Phones Bought</th><th class="n">Expenses Added</th><th></th></tr>' + r.staff.map(row).join('') + row(r.total) + '</table></div>';
    $('rDetail').innerHTML = '';
    $('rsTbl').onclick = function (e) {
      var b = e.target.closest('[data-who]'); if (!b) return;
      var who = b.getAttribute('data-who');
      call('salesList', { from: r.from, to: r.to, soldBy: who }).then(function (d) {
        var all = d.phones.concat(d.acc);
        $('rDetail').innerHTML = '<div class="card scroll"><h3>' + esc(who) + ': ' + all.length + ' sales</h3><table class="tbl"><tr><th>Date</th><th>Memo</th><th>Item</th><th>Customer</th><th class="n">Amount</th><th class="n">Profit</th></tr>' +
          (all.length ? all.map(function (x) {
            return '<tr><td>' + esc(prettyDate(x.date)) + '</td><td>' + esc(x.invoice) + '</td><td>' + esc(x.item) + (x.imei ? '<div class="muted">' + esc(x.imei) + '</div>' : '') +
              '</td><td>' + esc(x.customer) + '</td><td class="n">' + tk(x.amount) + '</td><td class="n">' + tk(x.profit) + '</td></tr>';
          }).join('') : '<tr><td colspan="6" class="muted">No sales</td></tr>') + '</table></div>';
        $('rDetail').scrollIntoView({ behavior: 'smooth' });
      });
    };
  });
}

/* ---------- settings ---------- */
function viewMore() {
  var tabs = [['pin', 'Change PIN']];
  if (isOwner()) tabs.unshift(['set', 'Shop Settings'], ['memo', 'Cash Memo'], ['backup', 'Backup']);
  var html = subTabs('more', tabs), s = S.sub.more, st = S.boot.settings;
  if (s === 'set') {
    html += '<div class="card"><h3>Shop Information (shown on the cash memo)</h3><div class="form">' + field('Shop Name', inp('stName', { v: st.ShopName })) +
      field('Address', inp('stAddr', { v: st.ShopAddress })) + field('Phone', inp('stPh', { v: st.ShopPhone })) + '</div>' +
      '<h3 style="margin-top:16px">Dropdown Lists (separate with commas)</h3><div class="form">' +
      field('Phone Types', '<textarea id="stPT" rows="2">' + esc(st.PhoneTypes) + '</textarea>') + field('Payment Methods', '<textarea id="stPM" rows="2">' + esc(st.PaymentMethods) + '</textarea>') +
      field('Expense Categories', '<textarea id="stEC" rows="3">' + esc(st.ExpenseCategories) + '</textarea>') + field('Accessory Categories', '<textarea id="stAC" rows="3">' + esc(st.AccCategories) + '</textarea>') +
      field('Asset Categories', '<textarea id="stAS" rows="3">' + esc(st.AssetCategories || '') + '</textarea>') +
      '</div><div class="actions"><button class="btn" id="stSave">Save</button></div></div>';
  }
  if (s === 'memo') {
    html += '<div class="card"><h3>Cash Memo Settings</h3><div class="form">' +
      field('Paper Size', '<select id="mSize">' + ['A5', 'A4', '80mm'].map(function (x) { return '<option value="' + x + '"' + (x === (st.MemoSize || 'A5') ? ' selected' : '') + '>' + { A5: 'A5 (half A4 page)', A4: 'A4 (full page)', '80mm': '80mm thermal roll printer' }[x] + '</option>'; }).join('') + '</select>') +
      '</div><div style="margin-top:10px">' + field('Terms &amp; Conditions (one per line)', '<textarea id="mTerms" rows="5">' + esc(st.MemoTerms || '') + '</textarea>') + '</div>' +
      '<div class="actions"><button class="btn" id="mSave">Save</button><button class="btn sec" id="mPrev">Preview Sample Memo</button></div></div>';
  }
  if (s === 'backup') html += '<div id="bkBox"><div class="card">Loading...</div></div>';
  if (s === 'pin') html += '<div class="card"><h3>Change PIN</h3><div class="form">' + field('Current PIN', inp('pOld', { type: 'password', mode: 'numeric' })) +
    field('New PIN (4-8 digits)', inp('pNew', { type: 'password', mode: 'numeric' })) + field('Confirm New PIN', inp('pNew2', { type: 'password', mode: 'numeric' })) +
    '</div><div class="actions"><button class="btn" id="pSave">Change PIN</button></div></div>';
  if (inApp()) html += '<div class="card"><h3>Android App</h3><div class="muted" style="margin-bottom:10px">Connect this app to a different Web App link (for example after creating a new deployment).</div>' +
    '<button class="btn sec" id="appLink">Change App Link</button></div>';
  html += '<div class="card"><button class="btn bad" id="logout">Logout</button></div>';
  $('app').innerHTML = html; bindSub('more');
  if (s === 'set') $('stSave').onclick = function () {
    call('settingsSave', { ShopName: val('stName'), ShopAddress: val('stAddr'), ShopPhone: val('stPh'), PhoneTypes: val('stPT'), PaymentMethods: val('stPM'),
                           ExpenseCategories: val('stEC'), AccCategories: val('stAC'), AssetCategories: val('stAS') }).then(function () { toast('Saved'); start(); });
  };
  if (s === 'memo') {
    $('mSave').onclick = function () { call('settingsSave', { MemoSize: val('mSize'), MemoTerms: $('mTerms').value }).then(function () { toast('Saved'); start(); }); };
    $('mPrev').onclick = function () {
      showMemo({ shop: { name: st.ShopName, address: st.ShopAddress, phone: st.ShopPhone }, memoSize: val('mSize'),
        terms: $('mTerms').value.split('\n').map(function (x) { return x.trim(); }).filter(String), invoice: 'INV-00000', date: today(),
        customer: 'Sample Customer', mobile: '01XXXXXXXXX', address: '', payment: 'Cash', soldBy: S.boot.user.Name,
        lines: [{ name: 'Samsung Galaxy A15 6/128', details: ['IMEI 1: 356789012345678', 'IMEI 2: 356789012345679', 'Black, New Official'], qty: 1, price: 19500, total: 19500 },
                { name: 'Type-C Fast Charger 25W', details: [], qty: 1, price: 550, total: 550 }],
        subtotal: 20050, discount: 50, exchange: 5000, exchanges: [{ name: 'Xiaomi Redmi 9 4/64', imei: '359999999999999', value: 5000 }],
        payable: 15000, warranty: '1 year official warranty' });
    };
  }
  if (s === 'backup') loadBackup();
  if (s === 'pin') $('pSave').onclick = function () {
    if (val('pNew') !== val('pNew2')) return toast('New PINs do not match', true);
    call('changePin', { oldPin: val('pOld'), newPin: val('pNew') }).then(function () { toast('PIN changed'); S.sub.more = isOwner() ? 'set' : 'pin'; render(); });
  };
  if ($('appLink')) $('appLink').onclick = function () { if (confirm('Change the Web App link this app opens?')) window.AndroidApp.resetUrl(); };
  $('logout').onclick = function () { call('logout', { token: S.token }, true).then(logoutLocal, logoutLocal); };
}

/* ---------- start ---------- */
if (API_URL.indexOf('http') !== 0) {
  $('app').innerHTML = '<div class="card"><h3>Setup needed</h3>Open index.html and paste your Apps Script Web App link into API_URL.</div>';
} else if (S.token) start(); else showLogin();
</script>
</body>
</html>
